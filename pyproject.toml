[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pressure-wound-manifests"
version = "1.0.0"
description = "Frozen split manifests and reproduction pipeline for pressure injury staging and tissue classification"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
keywords = ["pressure injury", "wound", "medical imaging", "reproducibility", "data leakage"]
classifiers = [
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

# Environment A: manifests, timm models, calibration, evaluation.
# The YOLO round runs in a separate environment; see requirements-yolo.txt.
dependencies = [
    "torch==2.10.0",
    "torchvision==0.25.0",
    "timm==1.0.25",
    "numpy==1.26.4",
    "scipy==1.17.1",
    "scikit-learn==1.8.0",
    "pillow==12.1.1",
]

[project.optional-dependencies]
# Pinned for reference. Installing this alongside the base pins will conflict:
# use a second virtual environment with requirements-yolo.txt instead.
yolo = [
    "torch==2.12.1",
    "torchvision==0.27.1",
    "ultralytics==8.4.86",
    "numpy==2.5.0",
]

[tool.setuptools]
py-modules = []
